<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido recebido — Bartolomeu</title><link rel="stylesheet" href="/style.css"></head><body><main class="thanks"><div class="thanksCard"><div class="bigPaw">🐾</div><h1 id="title">Conferindo seu pagamento…</h1><p id="status">Só um instante. Bartolomeu está fiscalizando.</p><a href="/" class="cta">Voltar para a lojinha</a></div></main><script>
const q=new URLSearchParams(location.search); const params=Object.fromEntries(q.entries());
if(params.order_nsu){fetch('/api/payment-status?'+new URLSearchParams({order_nsu:params.order_nsu,transaction_nsu:params.transaction_nsu||'',slug:params.slug||''})).then(r=>r.json()).then(d=>{document.querySelector('#title').textContent=d.paid?'Pagamento confirmado! 😸':'Pedido recebido';document.querySelector('#status').textContent=d.paid?'Sua caneca já pode entrar na fila de produção.':`Pedido ${d.orderId||params.order_nsu}: aguardando confirmação do pagamento.`}).catch(()=>{document.querySelector('#title').textContent='Pedido recebido';document.querySelector('#status').textContent='Não conseguimos consultar o pagamento agora. Guarde o número do pedido.'})}
</script></body></html>
